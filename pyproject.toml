[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-auto-bag-scanner"
version = "0.1.0"
description = "Offline-first Windows desktop application for controlled TT bag scanning"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openpyxl==3.1.5",
    "PySide6==6.12.0",
    "tzdata==2026.6",
    "uiautomator2==3.7.1",
]

[project.optional-dependencies]
dev = [
    "PyInstaller==6.22.3",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[project.scripts]
tt-auto-bag-scanner = "tt_auto_bag_scanner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "hardware: requires a locally authorized PDA and controlled WMS test parcel",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

